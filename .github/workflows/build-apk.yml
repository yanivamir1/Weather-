name: Build Android APK

on:
  push:
    branches: [ccr-f98f70c5-ezpkg5, main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ubuntu-latest GitHub-hosted runners already ship with a full Android SDK
      # (ANDROID_HOME / ANDROID_SDK_ROOT preconfigured, licenses pre-accepted), so no
      # separate SDK-install action is needed — Gradle just downloads the specific
      # platform/build-tools versions android/build.gradle asks for, on first build.

      - name: Sync Capacitor web assets into the native project
        run: npx cap sync android

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # www/js/version.js is the single source of truth for the app version (see CLAUDE.md).
      # Rename the built file to include it so a downloaded weather-v3.apk never gets
      # confused with an older weather-v2.apk sitting in the same Downloads folder.
      - name: Rename APK to include the app version
        id: version
        run: |
          VERSION=$(grep -oP "APP_VERSION = '\K[^']+" www/js/version.js)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/weather-${VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: weather-${{ steps.version.outputs.version }}
          path: dist/weather-${{ steps.version.outputs.version }}.apk
          if-no-files-found: error

      # GitHub Actions artifacts download from Azure blob storage, which some sandboxed
      # environments (this project's own dev environment included) can't reach directly.
      # Committing just the latest APK back into the repo lets it be fetched over plain git
      # instead, which always works. Only the latest is kept (not one file per version) to
      # avoid growing the repo indefinitely; version history lives in CHANGELOG.md instead.
      # [skip ci] avoids this commit re-triggering the workflow.
      - name: Commit latest APK to releases/ for direct git access
        run: |
          rm -f releases/weather-*.apk
          mkdir -p releases
          cp "dist/weather-${{ steps.version.outputs.version }}.apk" releases/weather-latest.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases/weather-latest.apk
          git diff --cached --quiet && exit 0
          git commit -m "Add ${{ steps.version.outputs.version }} APK to releases/ [skip ci]"
          git push

# This produces a debug-signed APK (signed with the fixed keystore committed at
# android/keystore/debug.keystore) — installable via "install unknown apps" on Android, not
# distributable through Play Store. To add a release-signed build later: store a base64-encoded
# keystore as a repo secret, decode it in a step here, add a `signingConfigs.release` block to
# android/app/build.gradle, and run `./gradlew assembleRelease` as well.
